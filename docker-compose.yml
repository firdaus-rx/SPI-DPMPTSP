services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spi-dpmptsp-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LARAVEL_OCR_DRIVER: "${LARAVEL_OCR_DRIVER:-tesseract}"
      TESSERACT_BINARY: "/usr/bin/tesseract"
      TESSERACT_LANGUAGE: "${TESSERACT_LANGUAGE:-ind+eng}"
      TESSERACT_TIMEOUT: "${TESSERACT_TIMEOUT:-60}"
      POPPLER_BINARY: "/usr/bin/pdftoppm"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/database/database.sqlite}"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - app_storage:/var/www/html/storage
      - app_db:/var/www/html/database
    networks:
      - spi
    healthcheck:
      test: ["CMD", "php", "-v"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: nginx:1.27-alpine
    container_name: spi-dpmptsp-web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8050}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
    networks:
      - spi

volumes:
  app_storage:
  app_db:

networks:
  spi:
    driver: bridge
