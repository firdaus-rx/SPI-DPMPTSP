services:
  app:
    build: .
    container_name: spi-dpmptsp-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8050}:${APP_PORT:-8050}"
    env_file:
      - .env
    environment:
      LARAVEL_OCR_DRIVER: "${LARAVEL_OCR_DRIVER:-tesseract}"
      TESSERACT_BINARY: "/usr/bin/tesseract"
      TESSERACT_LANGUAGE: "${TESSERACT_LANGUAGE:-ind+eng}"
      TESSERACT_TIMEOUT: "${TESSERACT_TIMEOUT:-60}"
      POPPLER_BINARY: "/usr/bin/pdftoppm"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/database/database.sqlite}"
    volumes:
      - app_storage:/var/www/html/storage
      - app_db:/var/www/html/database

volumes:
  app_storage:
  app_db:
